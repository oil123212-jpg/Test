name: Browser playground
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: momo_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:server
      - run: timeout 45s node --test tests/account-postgres.test.mjs
        env:
          DATABASE_URL: postgres://postgres:momo_ci@127.0.0.1:5432/postgres
      - run: npm run test:realtime
        env:
          DATABASE_URL: postgres://postgres:momo_ci@localhost:5432/postgres
